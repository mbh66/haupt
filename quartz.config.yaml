# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: Michael Haupt
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-GB
  baseUrl: michaelhaupt.com
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      # Single weights on purpose: Google Fonts rejects a request for weights a family lacks
      # (Libre Caslon Display has only 400; Libre Caslon Text has no bold italic).
      header:
        name: Libre Caslon Display
        weights: [400]
      body:
        name: Libre Caslon Text
        weights: [400]
        includeItalic: true
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f7f5ef"
        lightgray: "#e2e0d5"
        gray: "#6b766d"
        darkgray: "#2e3b33"
        dark: "#14281f"
        secondary: "#1f4d3a"
        tertiary: "#a1281e"
        highlight: rgba(31, 77, 58, 0.10)
        textHighlight: "#a8823a55"
      darkMode:
        light: "#121815"
        lightgray: "#26302a"
        gray: "#8b958d"
        darkgray: "#d5d8ce"
        dark: "#f0eee5"
        secondary: "#93c2a7"
        tertiary: "#e3826f"
        highlight: rgba(147, 194, 167, 0.14)
        textHighlight: "#d2ae6866"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: default
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: false
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: false
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: false
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: false
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 20
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links:
        GitHub: https://github.com/jackyzha0/quartz
        Discord Community: https://discord.gg/cRFFHYye7t
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: false
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "./plugins/masthead"
    enabled: true
    options:
      siteName: Michael Haupt
      nav:
        Letter Book: /
        Method: method
        Wikis: wikis
        About: about
    layout:
      position: header
      priority: 10
  - source: "./plugins/letterhead"
    enabled: true
    options:
      siteName: Michael Haupt
      place: Greyton, Valley of Grace
    layout:
      position: beforeBody
      priority: 5
  - source: "./plugins/ledger"
    enabled: true
    options:
      ledgerFoot: Results vary with rainfall.
    layout:
      position: afterBody
      priority: 10
  - source: "./plugins/author-block"
    enabled: true
    options:
      siteName: Michael Haupt
      place: Greyton, Valley of Grace
      authorPage: about-the-author
      copyrightHolder: Michael Haupt
      licence:
        name: CC BY-SA 4.0
        url: https://creativecommons.org/licenses/by-sa/4.0/
      links:
        The Letter Book: /
        The wikis: wikis
        About: about
      social:
        LinkedIn: https://www.linkedin.com/in/michaelhaupt/
        Substack: https://bioconomy.substack.com
        YouTube: https://www.youtube.com/@MichaelHaupt2035
    layout:
      position: footer
      priority: 10
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content:
      template: full-width
    folder:
      template: full-width
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      template: full-width
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
